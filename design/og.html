.field-label{margin-top:8px;font-size:22px;color:#a3b4c8}
.frame{border:3px solid #e6edf5;border-radius:3px;overflow:hidden;

svg{display:block}
.tier{font-family:A;font-weight:700;font-size:15px;fill:#a3b4c8}
.glyph{font-family:A;font-weight:700;text-anchor:middle;dominant-baseline:central}
